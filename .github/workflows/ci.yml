name: CI

# Quality gate for every push and PR to main. Institutionalizes the checks the
# integration steward runs by hand: lockfile integrity (npm ci), typecheck,
# module-boundary lint, the DB-backed test suite, and a production build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (npm ci · typecheck · lint · test · build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: orbit_app
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit_app -d orbit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://orbit_app:orbit@localhost:5432/orbit_test?schema=public
      TEST_DATABASE_URL: postgresql://orbit_app:orbit@localhost:5432/orbit_test?schema=public
      NEXTAUTH_SECRET: ci-dummy-secret-not-a-real-secret
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Lockfile integrity — catches "dep added without npm install"
      # (the exact bug that broke main on 2026-10-31).
      - name: Install (lockfile-verified)
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Migrate test database
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (module-boundary contract)
        run: npx eslint src/ --max-warnings=0

      - name: Test (vitest, DB-backed suites included)
        run: npm test

      - name: Build
        run: npm run build
